[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agora"
version = "0.9.0"
description = "Spawn coding-agent sessions from profiles in isolated containers and let them talk over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "pydantic>=2.5",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "cryptography>=41",  # Ed25519 keys of places and people
    "opentelemetry-sdk>=1.30",  # traces of sessions (telemetry)
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
# Only the tests use the official MCP SDK, as an independent client for the bridge.
test = ["mcp>=1.10"]

[project.scripts]
agora = "agora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
