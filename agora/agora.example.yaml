# agora configuration for one place (one machine).
# Copy to agora.yaml and run: agora daemon --config agora.yaml
# Relative paths are relative to this file.
#
# How a module's sessions run (harness, model, tools, limits, credentials)
# is in the module's own plugin.json. This file holds only what belongs to
# the machine.

# This place's name: the part after @ in its residents' addresses (id@place).
# Default: the hostname, lowercased.
# place: pc1

# The modules that can be started here. A repository module is pinned to a
# commit; a local one is for development. The module's id is its plugin.json name.
modules:
  - repo: https://github.com/ysgrProgramming/romaji-converter.git
    ref: 5d1255bf8f9b226703984332a03461d2884d6316
    path: execution
  - local: examples/modules/caller

# Places this one talks to. There is no center: each place lists the places it
# trusts, with their keys. `agora place --config agora.yaml` prints this place's
# entry to paste into the others' lists. Trusting a place means trusting it to
# speak for its residents and its operator.
# peers:
#   - name: pc2
#     url: http://pc2.tailnet.example:8765
#     public_key: 3b6a27bc...   # 64 hex characters, from `agora place` on pc2
# The URL the others reach this place at (shown by `agora place`). For other
# machines to reach it, listen_host must not be loopback only.
# public_url: http://pc1.tailnet.example:8765

# state_dir: ~/.local/state/agora   # history, bundles, module cache, the broker key and the place key

listen_host: 127.0.0.1   # 0.0.0.0 (or a VPN address) when other places must reach this one
listen_port: 8765

# docker: one container per session (default).
# local: plain child processes with NO isolation; for development only.
runner: docker
allow_local_runner: false

docker:
  binary: docker
  network: agora-net        # created on first start; the broker also listens on its gateway
  # Harness images are built on first use from images/<harness>/Dockerfile at
  # the harness version the module names (tag agora/<harness>:<version>).
  # build_args: {BASE_IMAGE: node:22-bookworm-slim}
  # build_network: host

# How containers reach the outside, for every session (e.g. through a proxy).
# network:
#   proxy: http://172.18.0.1:3128

# Per harness, when this machine provides it differently: a prebuilt image,
# or the ACP command (local runner).
# harnesses:
#   claude-code: {image: "sha256:..."}

# LLM gateway (LiteLLM Proxy). It holds the provider keys; agora gets a
# virtual key per session (tagged with the session, module and version, so
# the gateway can report cost per session) and deletes it when the session ends.
# llm_gateway:
#   url: http://127.0.0.1:4000              # as agora reaches it
#   session_url: http://172.18.0.1:4000     # as sessions reach it (default: url)
#   master_key_env: LITELLM_MASTER_KEY      # environment variable with the gateway's master key

# Session traces over OTLP/HTTP (OpenTelemetry), e.g. to Phoenix.
# telemetry:
#   otlp_endpoint: http://127.0.0.1:6006/v1/traces

# Global caps.
max_sessions: 8          # live managed sessions
max_spawn_depth: 2       # levels of spawning below the operator / an external session

keep_bundles: false      # keep each session's prepared workspace after it ends

# The broker's own ChatGPT plan login for Codex sessions (runtimes with login: chatgpt).
# Create it with `agora codex-login --config agora.yaml`. Default: <state_dir>/codex-login
# codex_login_dir: ~/.local/state/agora/codex-login
